# Zentraler Caddy: belegt als einziger die Ports 80 und 443 und macht HTTPS für alle Apps.
# Start (auf dem Server im Ordner /opt/server/caddy):   sudo docker compose up -d
# Voraussetzung einmalig:   einrichten/01-docker.sh  (installiert Docker und legt das Netzwerk "proxy" an)
name: caddy

services:
  caddy:
    container_name: caddy
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"        # nur für die Umleitung auf https und die Zertifikats-Prüfung
      - "443:443"      # HTTPS und WebSocket
      - "443:443/udp"  # HTTP/3 (schneller auf dem Handy)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Zertifikate und Schlüssel bleiben hier liegen, auch wenn der Container neu gebaut wird (kommt ins Backup)
      - ./data:/data
      - ./config:/config
    networks: [proxy]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  proxy:
    external: true
